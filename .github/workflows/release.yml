name: Release

# Publishing was previously manual from a maintainer laptop, with no attestation of
# what source produced the tarball. This workflow publishes from a tagged commit via
# npm trusted publishing (OIDC), so a consumer can verify the published artifact came
# from this repository at this commit.
#
# There is no npm token. Authentication is a short-lived OIDC credential minted by
# GitHub for this workflow file, exchanged with the registry at publish time. npm
# restricted bypass-2FA granular access tokens on 2026-07-31 and removes their direct
# publish capability in January 2027; trusted publishing is the path that survives
# that, and it removes the long-lived credential rather than rotating it.
#
# The trusted publisher is registered against this exact filename. Renaming this file
# breaks publishing until the registration on npmjs.com is updated to match.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # mints the OIDC token trusted publishing exchanges for registry auth

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0. Only the runner is pinned
          # here; the package still supports the range declared in engines.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Deliberately no dependency cache. A release build should resolve from the
          # registry rather than trust a cache entry keyed by a lockfile hash.

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          v=$(npm --version)
          echo "npm $v"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) {
              console.error(`npm ${process.argv[1]} is below the 11.5.1 required for trusted publishing`);
              process.exit(1);
            }
          ' "$v"

      - name: Install
        run: npm ci

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "version $pkg confirmed"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: MCP integration check
        run: npx ts-node tests/test-mcp-deep.ts
        timeout-minutes: 5

      - name: Pack and inspect contents
        run: |
          npm pack --dry-run
          # The package must never ship the analysis state or generated reports.
          if npm pack --dry-run 2>&1 | grep -E '\.veris/|veris-reports/|node_modules/'; then
            echo "packaged tarball contains files that must not ship"
            exit 1
          fi

      # No NODE_AUTH_TOKEN and no --provenance flag: trusted publishing authenticates
      # over OIDC and attaches provenance on its own for a public repository. Passing a
      # token here would silently take precedence over OIDC and reintroduce exactly the
      # long-lived credential this is meant to remove.
      - name: Publish to npm via trusted publishing
        if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.dry_run != 'true'
        run: npm publish --access public
