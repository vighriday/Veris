name: Veris CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-verify:
    name: verify (Node ${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Vitest 4 imports `styleText` from node:util, which is Node 20+. Veris itself
        # runs on Node 18 (see package.json engines), so 18 is still in the matrix and
        # still has to build, analyze a real repository and serve MCP — it just skips
        # the unit-test steps, which are a dev-tooling constraint rather than a
        # runtime one. Dropping 18 entirely would quietly stop testing a version we
        # claim to support.
        node: ['18', '20', '22']
        os: [ubuntu-latest]
        include:
          # Veris ships a Windows-specific MAX_PATH fallback in the git worktree path,
          # which Linux-only CI could never exercise.
          #
          # better-sqlite3 has no prebuilt binary for every Node/Windows pair and the
          # runner has no C++ toolchain, so it is an optionalDependency: npm skips it
          # rather than failing the install, and Veris runs without persistence. This
          # job therefore also proves the no-persistence path works end to end, which
          # is the same path a user on an unsupported platform gets.
          - node: '20'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Veris diffs against the merge-base with the base ref. A shallow clone has
          # no merge-base, and the run now fails loudly instead of inventing a
          # baseline — so full history is required, not merely preferable.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Report whether optional persistence is available
        shell: bash
        run: |
          if [ -d node_modules/better-sqlite3 ]; then
            echo "better-sqlite3 present — persistence tests will run"
          else
            echo "better-sqlite3 absent — exercising the no-persistence path"
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        if: matrix.node != '18'
        run: npm test

      - name: Coverage
        if: matrix.node != '18'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

      - name: CLI rejects an unknown subcommand
        shell: bash
        run: |
          if node dist/cli.js definitely-not-a-directory --quiet; then
            echo "expected a non-zero exit for an unknown target"
            exit 1
          fi
          echo "correctly rejected"

      - name: Smoke-test CLI
        run: node dist/cli.js . --base-ref=origin/${{ github.base_ref || github.ref_name }} --quiet
        env:
          VERIS_CONFIDENCE_THRESHOLD: '0'

      - name: Assert report output stays bounded
        shell: bash
        run: |
          # A 156 MB dashboard and a 1.26 MB report were both shipped before this gate
          # existed. Sizes are asserted, not eyeballed.
          dash_bytes=$(wc -c < veris-reports/veris-dashboard.html)
          md_bytes=$(wc -c < veris-reports/veris-report.md)
          echo "dashboard=${dash_bytes} bytes, report=${md_bytes} bytes"
          if [ "$dash_bytes" -gt 10000000 ]; then echo "dashboard exceeds 10MB"; exit 1; fi
          if [ "$md_bytes" -gt 1000000 ]; then echo "markdown report exceeds 1MB"; exit 1; fi

      # Runs on every entry including Node 18: this is the real runtime contract, and
      # it asserts the whole tool surface rather than merely starting the server.
      - name: MCP integration check
        run: npx ts-node tests/test-mcp-deep.ts
        timeout-minutes: 5

      - name: Upload Veris Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veris-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: veris-reports/
          if-no-files-found: ignore
